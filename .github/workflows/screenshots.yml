name: Generate App Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          fi
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Install iOS Simulator Runtime
        run: |
          echo "Available runtimes:"
          xcrun simctl list runtimes
          echo ""
          # Install iOS runtime if not present
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            echo "Installing iOS simulator runtime..."
            xcodebuild -downloadPlatform iOS
          fi
          echo "Runtimes after install:"
          xcrun simctl list runtimes

      - name: Create Simulator Devices
        run: |
          echo "=== All iPhone device types ==="
          xcrun simctl list devicetypes | grep -i "iphone"
          echo ""
          echo "=== All iPad device types ==="
          xcrun simctl list devicetypes | grep -i "ipad"
          echo ""

          # Get latest iOS runtime
          IOS_RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | awk '{print $NF}')
          echo "Using runtime: $IOS_RUNTIME"

          # Find 6.7" iPhone: prefer 16 Pro Max > 15 Pro Max > any Pro Max
          IPHONE_TYPE=""
          for pattern in "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 14 Pro Max"; do
            IPHONE_TYPE=$(xcrun simctl list devicetypes | grep "$pattern" | head -1 | sed 's/.*(\(com\.apple[^)]*\)).*/\1/')
            if [ -n "$IPHONE_TYPE" ]; then break; fi
          done
          echo "iPhone type: $IPHONE_TYPE"

          # Find iPad Pro 12.9": prefer newest generation
          IPAD_TYPE=""
          for pattern in "iPad Pro (12.9-inch) (6th" "iPad Pro (12.9-inch) (5th" "iPad Pro (12.9-inch) (4th" "iPad Pro (12.9-inch) (3rd" "iPad Pro (11-inch) (3rd" "iPad Pro (11-inch) (4th"; do
            IPAD_TYPE=$(xcrun simctl list devicetypes | grep "$pattern" | head -1 | sed 's/.*(\(com\.apple[^)]*\)).*/\1/')
            if [ -n "$IPAD_TYPE" ]; then break; fi
          done
          echo "iPad type: $IPAD_TYPE"

          # Create iPhone
          if [ -n "$IPHONE_TYPE" ]; then
            IPHONE_UUID=$(xcrun simctl create "ScreenshotPhone" "$IPHONE_TYPE" "$IOS_RUNTIME" 2>&1) || true
            if [[ "$IPHONE_UUID" == *-*-*-*-* ]]; then
              echo "Created iPhone: $IPHONE_UUID"
              echo "IPHONE_UUID=$IPHONE_UUID" >> $GITHUB_ENV
            else
              echo "iPhone creation failed: $IPHONE_UUID"
              # Fallback: use any available iPhone simulator
              IPHONE_UUID=$(xcrun simctl list devices available | grep -i "iphone" | head -1 | sed 's/.*(\([^)]*\)).*/\1/')
              echo "Fallback iPhone: $IPHONE_UUID"
              echo "IPHONE_UUID=$IPHONE_UUID" >> $GITHUB_ENV
            fi
          fi

          # Create iPad
          if [ -n "$IPAD_TYPE" ]; then
            IPAD_UUID=$(xcrun simctl create "ScreenshotPad" "$IPAD_TYPE" "$IOS_RUNTIME" 2>&1) || true
            if [[ "$IPAD_UUID" == *-*-*-*-* ]]; then
              echo "Created iPad: $IPAD_UUID"
              echo "IPAD_UUID=$IPAD_UUID" >> $GITHUB_ENV
            else
              echo "iPad creation failed (non-critical): $IPAD_UUID"
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project NichanMatome.xcodeproj \
            -scheme NichanMatome \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_UUID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Take iPhone Screenshots
        run: |
          mkdir -p screenshots

          xcrun simctl boot "$IPHONE_UUID"
          sleep 5

          APP_PATH=$(find build/DerivedData -name "*.app" -path "*/Debug-iphonesimulator/*" | head -1)
          echo "App: $APP_PATH"
          xcrun simctl install "$IPHONE_UUID" "$APP_PATH"
          xcrun simctl launch "$IPHONE_UUID" com.tokyonasu.matomeyomikiri
          sleep 10

          xcrun simctl io "$IPHONE_UUID" screenshot screenshots/iphone67_01_home.png
          sleep 2
          xcrun simctl io "$IPHONE_UUID" screenshot screenshots/iphone67_02_insights.png
          sleep 2
          xcrun simctl io "$IPHONE_UUID" screenshot screenshots/iphone67_03_sources.png

          xcrun simctl shutdown "$IPHONE_UUID"

      - name: Take iPad Screenshots
        if: env.IPAD_UUID != ''
        run: |
          xcrun simctl boot "$IPAD_UUID"
          sleep 5

          APP_PATH=$(find build/DerivedData -name "*.app" -path "*/Debug-iphonesimulator/*" | head -1)
          xcrun simctl install "$IPAD_UUID" "$APP_PATH"
          xcrun simctl launch "$IPAD_UUID" com.tokyonasu.matomeyomikiri
          sleep 10

          xcrun simctl io "$IPAD_UUID" screenshot screenshots/ipad129_01_home.png
          sleep 2
          xcrun simctl io "$IPAD_UUID" screenshot screenshots/ipad129_02_insights.png
          sleep 2
          xcrun simctl io "$IPAD_UUID" screenshot screenshots/ipad129_03_sources.png

          xcrun simctl shutdown "$IPAD_UUID"

      - name: Resize screenshots for App Store
        run: |
          pip3 install --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          import os

          targets = {
              "iphone67": (1290, 2796),
              "ipad129": (2048, 2732),
          }

          for f in sorted(os.listdir("screenshots")):
              path = os.path.join("screenshots", f)
              img = Image.open(path)
              for prefix, size in targets.items():
                  if f.startswith(prefix):
                      if img.size != size:
                          img = img.resize(size, Image.LANCZOS)
                          img.save(path)
                          print(f"Resized {f}: {img.size} -> {size}")
                      else:
                          print(f"{f}: already {size}")
                      break
          PYEOF

      - name: List screenshots
        run: ls -la screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots/
          retention-days: 30
