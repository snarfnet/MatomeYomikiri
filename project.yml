name: NichanMatome
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Manual
    GAD_BANNER_BOTTOM_AD_UNIT_ID: "ca-app-pub-9404799280370656/6319455784"
    GAD_BANNER_TOP_AD_UNIT_ID: "ca-app-pub-9404799280370656/2780271265"
    GAD_BANNER_DETAIL_AD_UNIT_ID: "ca-app-pub-9404799280370656/4855770262"
    GAD_BANNER_INLINE_AD_UNIT_ID: "ca-app-pub-9404799280370656/3095131881"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0

targets:
  NichanMatome:
    type: application
    platform: iOS
    sources: [NichanMatome]
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: NichanMatome/Info.plist
        PRODUCT_NAME: MatomeYomikiri
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.matomeyomikiri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "MatomeYomikiri AppStore"
    info:
      path: NichanMatome/Info.plist
      properties:
        CFBundleName: "まとめ・よみきり"
        CFBundleDisplayName: "まとめ・よみきり"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~4316108976"
        GADBannerBottomAdUnitID: "$(GAD_BANNER_BOTTOM_AD_UNIT_ID)"
        GADBannerTopAdUnitID: "$(GAD_BANNER_TOP_AD_UNIT_ID)"
        GADBannerDetailAdUnitID: "$(GAD_BANNER_DETAIL_AD_UNIT_ID)"
        GADBannerInlineAdUnitID: "$(GAD_BANNER_INLINE_AD_UNIT_ID)"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            blog.livedoor.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            vippers.jp:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

